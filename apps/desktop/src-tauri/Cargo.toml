[package]
name = "loredock-desktop"
version = "0.1.0"
description = "LoreDock desktop shell"
authors = ["LoreDock contributors"]
edition = "2024"
license = "LicenseRef-PolyForm-Noncommercial-1.0.0"
publish = false

[lib]
name = "loredock_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
uuid = { version = "1", features = ["v4"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
