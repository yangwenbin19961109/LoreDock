[project]
name = "loredock-core"
version = "0.1.0"
description = "Local-first application core for LoreDock"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "PolyForm-Noncommercial-1.0.0" }
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "keyring>=25.7,<26",
  "lxml>=6,<7",
  "mcp>=1.28,<2",
  "numpy>=2,<3",
  "onnxruntime>=1.23,<2",
  "pydantic-settings>=2.10,<3",
  "pypdf>=6,<7",
  "python-docx>=1.2,<2",
  "python-multipart>=0.0.20,<1",
  "sqlite-vec>=0.1.6,<0.2",
  "tokenizers>=0.22,<1",
  "uvicorn[standard]>=0.35,<1",
]

[project.scripts]
loredock-eval = "loredock.evaluation.cli:main"
loredock-bench = "loredock.evaluation.benchmark:main"
loredock-model = "loredock.retrieval.model_cli:main"
loredock-mcp = "loredock.mcp.bridge:main"

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pyinstaller>=6.16,<7",
  "pyright>=1.1.400,<2",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loredock"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -q"
testpaths = ["tests"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
