name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm --filter @loredock/web... typecheck
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - run: pnpm --filter @loredock/contracts build
      - run: pnpm --filter @loredock/ui build
      - run: pnpm --filter @loredock/web build

  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: python -m pip install uv
      - run: uv sync --directory core --all-groups --locked
      - run: uv run --directory core ruff format --check .
      - run: uv run --directory core ruff check .
      - run: uv run --directory core pyright
      - run: uv run --directory core pytest
      - run: uv run --directory core loredock-eval

  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - run: sudo apt-get update
        if: runner.os == 'Linux'
      - run: sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
        if: runner.os == 'Linux'
      - run: pnpm install --frozen-lockfile
      - run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings

  windows-installer:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [web, core, desktop]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      - run: python -m pip install uv
      - run: uv sync --directory core --all-groups --locked
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:desktop:windows
      - run: pnpm test:core:windows
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

  source-preview:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: windows-installer
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-installers
          path: installers
      - name: Publish Windows prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --verify-tag \
            --prerelease \
            --title "${GITHUB_REF_NAME} (Windows preview)" \
            --notes "Windows x64 preview installers under PolyForm Noncommercial 1.0.0. The installers are unsigned. Transitive third-party notices are bundled as licenses/third-party/THIRD_PARTY_NOTICES.txt with an empty REVIEW_NEEDED.txt. Clean-VM installation, upgrade and uninstall validation is still pending; this is not a formal release."
          gh release upload "${GITHUB_REF_NAME}" installers/*
