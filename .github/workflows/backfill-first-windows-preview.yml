name: Attach first Windows preview installers

on:
  push:
    branches: [main]
    paths: [.github/workflows/backfill-first-windows-preview.yml]

permissions:
  contents: read

jobs:
  attach:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.1.0-preview.1
      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      - run: python -m pip install uv
      - run: uv sync --directory core --all-groups --locked
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:desktop:windows
      - run: pnpm test:core:windows
      - name: Attach installers and correct preview notes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $msi = Get-Item apps/desktop/src-tauri/target/release/bundle/msi/*.msi
          $nsis = Get-Item apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
          gh release upload v0.1.0-preview.1 $msi.FullName $nsis.FullName
          if ($LASTEXITCODE -ne 0) { throw 'Installer upload failed.' }
          gh release edit v0.1.0-preview.1 `
            --title 'v0.1.0-preview.1 (Windows preview)' `
            --notes 'Windows x64 preview installers under PolyForm Noncommercial 1.0.0. The installers are unsigned. Clean-VM installation, upgrade and uninstall validation and complete transitive third-party notices are still pending; this is not a formal release.'
          if ($LASTEXITCODE -ne 0) { throw 'Release note update failed.' }
